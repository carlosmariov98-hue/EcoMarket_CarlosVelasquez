<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactanos</title>
    <link rel="stylesheet" href="../css/contacto.css">
</head>
<body>
        <header>
            <div class="logo">
                <img src="../img/icons/logoprincipal.png" alt="EcoMarketCarlos">
            </div>
            <nav>
            <ul class="nav-links">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="sobre-nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
            </nav>
        </header>
        <main>
        <section>
            <h2>Muchas gracias por preferir nuestra tienda EcoMarketCarlos</h2>
            <p>Acontinuacion dejanos algunos de tus datos y en breve nos contactaremos contigo</p>
            <img src="../img/icons/hechoconcaña.png" alt="caña de azucar">
        </section>
        <section id="contact" class="contact">
            <h2>Contacto</h2>
            <form action="#" method="post">
                <input type="text" name="name" placeholder="Tu Nombre" required>
                <input type="text" name="ciudad" placeholder="de que ciudad nos contactas" required>
                <input type="number" name="phone" placeholder="Tu Número de Teléfono" required>
                <input type="email" name="email" placeholder="Tu Correo Electrónico" required>
                <textarea name="message" placeholder="Tu Mensaje" required></textarea>
                
                <button type="submit" class="btn">Enviar Mensaje</button>
            </form>

            
        </section>
    </main>
</body>
</html>
